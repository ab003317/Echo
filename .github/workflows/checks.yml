name: 檢查 / Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    name: 伺服器與 Docker / Server and Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - run: pip install -r server/requirements.lock
      - run: python -m pytest server -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t echo:test .
      - run: python scripts/docker_smoke.py
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: 安裝 SDK / Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: 建置與檢查 / Build and check
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: echo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
